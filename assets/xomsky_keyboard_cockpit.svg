<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e232d" />
      <stop offset="100%" stop-color="#12151b" />
    </linearGradient>
    <linearGradient id="key-default" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282e3a" />
      <stop offset="100%" stop-color="#1a1f28" />
    </linearGradient>

    <!-- Highlight Key Gradients -->
    <linearGradient id="key-caps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0040A8" />
    </linearGradient>
    <linearGradient id="key-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#007770" />
    </linearGradient>
    <linearGradient id="key-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#A65D00" />
    </linearGradient>
    <linearGradient id="key-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#187830" />
    </linearGradient>
    <linearGradient id="key-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AF52DE" />
      <stop offset="100%" stop-color="#6B2791" />
    </linearGradient>
    <linearGradient id="key-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55" />
      <stop offset="100%" stop-color="#A8112E" />
    </linearGradient>
    <linearGradient id="key-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#A66400" />
    </linearGradient>
    <linearGradient id="key-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#2F2E8A" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow-caps" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#007AFF" flood-opacity="0.6" />
    </filter>
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #8b949e; }
    .key-cap { stroke: #384252; stroke-width: 1; rx: 7px; ry: 7px; filter: url(#glow-subtle); }
    .key-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, monospace; font-size: 14px; font-weight: 600; fill: #c9d1d9; text-anchor: middle; dominant-baseline: central; }
    .key-badge { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .legend-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .legend-desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="520" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" class="title-text">✨ The Xomsky Home-Row Cockpit (Visual Cheat Sheet)</text>
    <text x="0" y="20" class="subtitle-text">Zero cognitive friction: your muscle memory replaces Spotlight, Raycast, and manual window management.</text>
  </g>

  <!-- Keyboard Chassis -->
  <rect x="36" y="72" width="928" height="330" rx="16" fill="url(#chassis-grad)" stroke="#2d333b" stroke-width="1.5" filter="url(#glow-subtle)" />

  <!-- ROW 1: Numbers (y=90, h=46) -->
  <g transform="translate(54, 90)">
    <!-- ` -->
    <rect x="0" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" />
    <text x="23" y="23" class="key-text">~</text>

    <!-- 1 (Profile 1: Work) -->
    <rect x="54" y="0" width="52" height="46" fill="url(#key-cyan)" stroke="#00E5DA" stroke-width="1.5" rx="7" />
    <text x="80" y="16" class="key-text" fill="#ffffff" font-weight="bold">1</text>
    <text x="80" y="33" class="key-badge">WORK</text>

    <!-- 2 (Profile 2: Personal) -->
    <rect x="114" y="0" width="52" height="46" fill="url(#key-orange)" stroke="#FFB340" stroke-width="1.5" rx="7" />
    <text x="140" y="16" class="key-text" fill="#ffffff" font-weight="bold">2</text>
    <text x="140" y="33" class="key-badge">PERSONAL</text>

    <!-- 3 (Profile 3: Dev) -->
    <rect x="174" y="0" width="52" height="46" fill="url(#key-green)" stroke="#52E075" stroke-width="1.5" rx="7" />
    <text x="200" y="16" class="key-text" fill="#ffffff" font-weight="bold">3</text>
    <text x="200" y="33" class="key-badge">DEV</text>

    <!-- 4 (Profile 4: Client) -->
    <rect x="234" y="0" width="52" height="46" fill="url(#key-purple)" stroke="#C776ED" stroke-width="1.5" rx="7" />
    <text x="260" y="16" class="key-text" fill="#ffffff" font-weight="bold">4</text>
    <text x="260" y="33" class="key-badge">CLIENT</text>

    <!-- 5 to = -->
    <rect x="294" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="317" y="23" class="key-text">5</text>
    <rect x="348" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="371" y="23" class="key-text">6</text>
    <rect x="402" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="425" y="23" class="key-text">7</text>
    <rect x="456" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="479" y="23" class="key-text">8</text>
    <rect x="510" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="533" y="23" class="key-text">9</text>
    <rect x="564" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="587" y="23" class="key-text">0</text>
    <rect x="618" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="641" y="23" class="key-text">-</text>
    <rect x="672" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="695" y="23" class="key-text">=</text>
    <rect x="726" y="0" width="86" height="46" fill="url(#key-default)" class="key-cap" /><text x="769" y="23" class="key-text">delete</text>
  </g>

  <!-- ROW 2: QWERTY (y=144, h=46) -->
  <g transform="translate(54, 144)">
    <rect x="0" y="0" width="68" height="46" fill="url(#key-default)" class="key-cap" /><text x="34" y="23" class="key-text">tab</text>
    <rect x="76" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="99" y="23" class="key-text">Q</text>
    <rect x="130" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="153" y="23" class="key-text">W</text>
    <rect x="184" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="207" y="23" class="key-text">E</text>
    <rect x="238" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="261" y="23" class="key-text">R</text>

    <!-- T (Terminal) -->
    <rect x="292" y="0" width="52" height="46" fill="url(#key-green)" stroke="#52E075" stroke-width="1.5" rx="7" />
    <text x="318" y="16" class="key-text" fill="#ffffff" font-weight="bold">T</text>
    <text x="318" y="33" class="key-badge">TERMINAL</text>

    <rect x="352" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="375" y="23" class="key-text">Y</text>
    <rect x="406" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="429" y="23" class="key-text">U</text>

    <!-- I (IDE) -->
    <rect x="460" y="0" width="52" height="46" fill="url(#key-indigo)" stroke="#7E7BF2" stroke-width="1.5" rx="7" />
    <text x="486" y="16" class="key-text" fill="#ffffff" font-weight="bold">I</text>
    <text x="486" y="33" class="key-badge">IDE</text>

    <rect x="520" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="543" y="23" class="key-text">O</text>
    <rect x="574" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="597" y="23" class="key-text">P</text>
    <rect x="628" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="651" y="23" class="key-text">[</text>
    <rect x="682" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="705" y="23" class="key-text">]</text>
    <rect x="736" y="0" width="76" height="46" fill="url(#key-default)" class="key-cap" /><text x="774" y="23" class="key-text">\</text>
  </g>

  <!-- ROW 3: HOME ROW (y=198, h=46) -->
  <g transform="translate(54, 198)">
    <!-- CAPS LOCK (MASTER MODIFIER) -->
    <rect x="0" y="0" width="86" height="46" fill="url(#key-caps)" stroke="#5AC8FA" stroke-width="2" rx="7" filter="url(#glow-caps)" />
    <text x="43" y="16" class="key-text" fill="#ffffff" font-weight="bold">CAPS</text>
    <text x="43" y="33" class="key-badge" fill="#E1F5FE">★ MODIFIER</text>

    <!-- A (AI Agent) -->
    <rect x="94" y="0" width="52" height="46" fill="url(#key-coral)" stroke="#FF6B8B" stroke-width="1.5" rx="7" />
    <text x="120" y="16" class="key-text" fill="#ffffff" font-weight="bold">A</text>
    <text x="120" y="33" class="key-badge">AI AGENT</text>

    <rect x="154" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="177" y="23" class="key-text">S</text>
    <rect x="208" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="231" y="23" class="key-text">D</text>

    <!-- F (Finder) -->
    <rect x="262" y="0" width="52" height="46" fill="url(#key-cyan)" stroke="#5AC8FA" stroke-width="1.5" rx="7" />
    <text x="288" y="16" class="key-text" fill="#ffffff" font-weight="bold">F</text>
    <text x="288" y="33" class="key-badge">FINDER</text>

    <rect x="322" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="345" y="23" class="key-text">G</text>
    <rect x="376" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="399" y="23" class="key-text">H</text>
    <rect x="430" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="453" y="23" class="key-text">J</text>
    <rect x="484" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="507" y="23" class="key-text">K</text>
    <rect x="538" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="561" y="23" class="key-text">L</text>
    <rect x="592" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="615" y="23" class="key-text">;</text>
    <rect x="646" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="669" y="23" class="key-text">'</text>
    <rect x="700" y="0" width="112" height="46" fill="url(#key-default)" class="key-cap" /><text x="756" y="23" class="key-text">return</text>
  </g>

  <!-- ROW 4: BOTTOM ROW (y=252, h=46) -->
  <g transform="translate(54, 252)">
    <rect x="0" y="0" width="106" height="46" fill="url(#key-default)" class="key-cap" /><text x="53" y="23" class="key-text">shift</text>
    <rect x="114" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="137" y="23" class="key-text">Z</text>
    <rect x="168" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="191" y="23" class="key-text">X</text>

    <!-- C (Chrome Profiles) -->
    <rect x="222" y="0" width="52" height="46" fill="url(#key-caps)" stroke="#5AC8FA" stroke-width="1.5" rx="7" />
    <text x="248" y="16" class="key-text" fill="#ffffff" font-weight="bold">C</text>
    <text x="248" y="33" class="key-badge">CHROME</text>

    <rect x="282" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="305" y="23" class="key-text">V</text>

    <!-- B (Brave Profiles) -->
    <rect x="336" y="0" width="52" height="46" fill="url(#key-orange)" stroke="#FFB340" stroke-width="1.5" rx="7" />
    <text x="362" y="16" class="key-text" fill="#ffffff" font-weight="bold">B</text>
    <text x="362" y="33" class="key-badge">BRAVE</text>

    <!-- N (Notes) -->
    <rect x="396" y="0" width="52" height="46" fill="url(#key-amber)" stroke="#FFD066" stroke-width="1.5" rx="7" />
    <text x="422" y="16" class="key-text" fill="#ffffff" font-weight="bold">N</text>
    <text x="422" y="33" class="key-badge">NOTES</text>

    <rect x="456" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="479" y="23" class="key-text">M</text>
    <rect x="510" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="533" y="23" class="key-text">,</text>
    <rect x="564" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="587" y="23" class="key-text">.</text>
    <rect x="618" y="0" width="46" height="46" fill="url(#key-default)" class="key-cap" /><text x="641" y="23" class="key-text">/</text>
    <rect x="672" y="0" width="140" height="46" fill="url(#key-default)" class="key-cap" /><text x="742" y="23" class="key-text">shift</text>
  </g>

  <!-- ROW 5: MODIFIERS (y=306, h=46) -->
  <g transform="translate(54, 306)">
    <rect x="0" y="0" width="62" height="46" fill="url(#key-default)" class="key-cap" /><text x="31" y="23" class="key-text">fn</text>
    <rect x="70" y="0" width="62" height="46" fill="url(#key-default)" class="key-cap" /><text x="101" y="23" class="key-text">control</text>
    <rect x="140" y="0" width="68" height="46" fill="url(#key-default)" class="key-cap" /><text x="174" y="23" class="key-text">option</text>
    <rect x="216" y="0" width="86" height="46" fill="url(#key-default)" class="key-cap" /><text x="259" y="23" class="key-text">command</text>
    <rect x="310" y="0" width="286" height="46" fill="url(#key-default)" class="key-cap" /><text x="453" y="23" class="key-text">space</text>
    <rect x="604" y="0" width="86" height="46" fill="url(#key-default)" class="key-cap" /><text x="647" y="23" class="key-text">command</text>
    <rect x="698" y="0" width="68" height="46" fill="url(#key-default)" class="key-cap" /><text x="732" y="23" class="key-text">option</text>
    <rect x="774" y="0" width="38" height="46" fill="url(#key-default)" class="key-cap" /><text x="793" y="23" class="key-text">◀</text>
  </g>

  <!-- FOOTER / 3 CORE PILLARS LEGEND -->
  <g transform="translate(54, 430)">
    <!-- Pillar 1: Profiles -->
    <rect x="0" y="0" width="270" height="58" rx="10" fill="#1c2128" stroke="#00C7BE" stroke-width="1" />
    <text x="16" y="24" class="legend-title" fill="#00C7BE">⚡ Caps + 1..4 (or C/B)</text>
    <text x="16" y="42" class="legend-desc">Direct Chromium Profile Teleportation</text>

    <!-- Pillar 2: App Launch -->
    <rect x="290" y="0" width="270" height="58" rx="10" fill="#1c2128" stroke="#30D158" stroke-width="1" />
    <text x="306" y="24" class="legend-title" fill="#30D158">🚀 Caps + T / I / A / N / F</text>
    <text x="306" y="42" class="legend-desc">Instant First-Letter App Switching</text>

    <!-- Pillar 3: Copy-on-Select -->
    <rect x="580" y="0" width="270" height="58" rx="10" fill="#1c2128" stroke="#FF9F0A" stroke-width="1" />
    <text x="596" y="24" class="legend-title" fill="#FF9F0A">📋 Mouse Drag &gt;10pt</text>
    <text x="596" y="42" class="legend-desc">Linux Copy-on-Select with HUD Toast</text>
  </g>
</svg>
