name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        
      - name: Compile Tests
        run: ./tests/run_tests.sh
        
      - name: Build Native App
        run: ./build_native_app.sh
