name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v2.1.0)

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for changelog generation

      - name: Select Xcode version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | grep -v "Xcode_15" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          echo "Active Developer Directory: $(xcode-select -p)"
          swift --version

      - name: Build Native App
        run: ./build_native_app.sh

      - name: Package Full PKG
        run: ./build_full_pkg.sh

      - name: Create DMG and Update Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "$SPARKLE_PRIVATE_KEY" > sparkle_private.key
          fi
          ./release.sh
          rm -f sparkle_private.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacProductivitySuite.dmg
            dist/MacProductivitySuite-Full.pkg
            appcast.xml
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Generate Release Telemetry & Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Release Pipeline Summary & Metrics
          
          | Release Property | Value |
          | :--- | :--- |
          | **Version Tag** | `${{ github.ref_name }}` |
          | **Marketing Version** | `$(cat VERSION.txt 2>/dev/null || echo 'N/A')` |
          | **Build Number** | `$(cat BUILD.txt 2>/dev/null || echo 'N/A')` |
          | **Sparkle EdDSA Signature** | ✅ Generated & Injected into `appcast.xml` |
          | **Distribution Artifacts** | `MacProductivitySuite.dmg`, `MacProductivitySuite-Full.pkg` |
          EOF
