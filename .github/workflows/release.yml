name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v2.1.0)

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for changelog generation

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi

      - name: Build Native App
        run: ./build_native_app.sh

      - name: Package Full PKG
        run: ./build_full_pkg.sh

      - name: Create DMG and Update Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Write the secret to a temporary file for the release script
          echo "$SPARKLE_PRIVATE_KEY" > sparkle_private.key
          ./release.sh
          rm sparkle_private.key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacProductivitySuite.dmg
            dist/MacProductivitySuite-Full.pkg
            appcast.xml
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Generate Release Telemetry & Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Release Pipeline Summary & Metrics
          
          | Release Property | Value |
          | :--- | :--- |
          | **Version Tag** | `${{ github.ref_name }}` |
          | **Marketing Version** | `$(cat VERSION.txt 2>/dev/null || echo 'N/A')` |
          | **Build Number** | `$(cat BUILD.txt 2>/dev/null || echo 'N/A')` |
          | **Sparkle EdDSA Signature** | ✅ Generated & Injected into `appcast.xml` |
          | **Distribution Artifacts** | `MacProductivitySuite.dmg`, `MacProductivitySuite-Full.pkg` |
          EOF
