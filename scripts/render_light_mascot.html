<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Chomyak Light 3D Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1024px; height: 1024px; overflow: hidden; background: #FDF8FA; }
    #canvas-container { width: 1024px; height: 1024px; }
  </style>
  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/OrbitControls.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        if (typeof profileWindows !== "undefined") {
          profileWindows.forEach(w => scene.remove(w));
        }
        camera.fov = 47;
        camera.position.set(0, 1.50, 6.9);
        controls.target.set(0, 1.24, 0);
        controls.update();
        camera.updateProjectionMatrix();
        
        renderer.render(scene, camera);
        window.renderReady = true;
      }, 350);
    });
  </script>
</body>
</html>
