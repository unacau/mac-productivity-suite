<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Khomyak AppIcon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      width: 1024px;
      height: 1024px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .ui-overlay, .top-nav, .insight-card, .thought-bar-wrapper, .control-hint-pill {
      display: none !important;
    }
  </style>
  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/OrbitControls.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    window.renderReady = false;
    window.addEventListener("load", () => {
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const theme = urlParams.get("theme") || "light";
        const fov = parseFloat(urlParams.get("fov") || "40");
        const camY = parseFloat(urlParams.get("camY") || "1.72");
        const camZ = parseFloat(urlParams.get("camZ") || "5.9");
        const targetY = parseFloat(urlParams.get("targetY") || "1.05");
        const noKeyboard = urlParams.get("noKeyboard") === "true";

        // 1. Remove UI-only objects from 3D scene
        if (typeof portalWindowMesh !== "undefined" && portalWindowMesh) {
          scene.remove(portalWindowMesh);
        }

        // 2. Remove keyboard if requested ("pure hamster")
        if (noKeyboard && typeof keyboardGroup !== "undefined" && keyboardGroup) {
          scene.remove(keyboardGroup);
          
          const pawSpacing = parseFloat(urlParams.get("pawSpacing") || "0.32");
          const pawY = parseFloat(urlParams.get("pawY") || "0.22");
          const pawZ = parseFloat(urlParams.get("pawZ") || "0.92");
          if (hamsterRoot && hamsterRoot.children.length >= 7) {
            hamsterRoot.children[5].position.set(-pawSpacing, pawY, pawZ);
            hamsterRoot.children[6].position.set(pawSpacing, pawY, pawZ);
            hamsterRoot.children[5].rotation.x = 0.15;
            hamsterRoot.children[6].rotation.x = 0.15;
          }

          const hideFeet = urlParams.get("hideFeet") === "true";
          const feetSpacing = parseFloat(urlParams.get("feetSpacing") || "0.78");
          const feetY = parseFloat(urlParams.get("feetY") || "-0.12");
          const feetZ = parseFloat(urlParams.get("feetZ") || "0.35");
          if (hamsterRoot && hamsterRoot.children.length >= 9) {
            if (hideFeet) {
              hamsterRoot.children[7].visible = false;
              hamsterRoot.children[8].visible = false;
            } else {
              hamsterRoot.children[7].position.set(-feetSpacing, feetY, feetZ);
              hamsterRoot.children[8].position.set(feetSpacing, feetY, feetZ);
            }
          }
        }

        // 3. Apply theme
        if (typeof applyTheme === "function") {
          applyTheme(theme, false);
        }

        // Center key light for symmetrical icon portrait if requested
        const centerKeyLight = urlParams.get("centerKeyLight") === "true";
        if (centerKeyLight && typeof keyLight !== "undefined" && keyLight) {
          keyLight.position.set(0.5, 8, 5.5);
        }

        // Custom paw wave pose if requested
        const wavePaw = urlParams.get("wavePaw") === "true";
        if (wavePaw && hamsterRoot && hamsterRoot.children.length >= 7) {
          hamsterRoot.children[5].position.set(-0.25, 0.40, 1.05); // Left paw at chest
          hamsterRoot.children[6].position.set(0.52, 0.65, 1.05);  // Right paw raised in wave!
          hamsterRoot.children[6].rotation.z = -0.35;
          hamsterRoot.children[6].rotation.x = 0.10;
        }

        // 4. Highlight Caps Lock key with active glow if keyboard exists
        if (!noKeyboard && typeof keyMeshMap !== "undefined" && keyMeshMap["caps"]) {
          const capsKey = keyMeshMap["caps"];
          capsKey.position.y = -0.015;
          capsKey.traverse(child => {
            if (child.isPointLight) {
              child.intensity = 4.0;
              child.distance = 2.5;
            }
          });
        }

        // 5. Adjust camera & controls
        camera.fov = fov;
        camera.position.set(0, camY, camZ);
        controls.target.set(0, targetY, 0);
        controls.update();
        camera.updateProjectionMatrix();

        // 6. Force render
        renderer.setSize(1024, 1024);
        renderer.render(scene, camera);
        window.renderReady = true;
      }, 400);
    });
  </script>
</body>
</html>
