<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xomsky 60 FPS WebGL Loop Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #090A0F;
    }
    #canvas-container {
      width: 1600px;
      height: 900px;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Hide all HTML overlays to expose the pure 3D canvas */
    .ui-overlay, .top-nav, .hero-card, .insight-card, .thought-bar-wrapper, .control-hint-pill {
      display: none !important;
    }
  </style>

  <script>
    // Intercept default requestAnimationFrame to control loop deterministically
    window._stopDefaultRAF = true;
    const _origRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb) {
      if (window._stopDefaultRAF) return 0;
      return _origRAF(cb);
    };
  </script>

  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/OrbitControls.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    window.renderReady = false;

    // Helper to create human silhouette meshes in the deep liminal background
    function addLiminalSilhouettes() {
      if (typeof scene === "undefined") return;

      const silhouetteGroup = new THREE.Group();
      silhouetteGroup.name = "liminalSilhouettes";

      const silMat = new THREE.MeshStandardMaterial({
        color: 0x05070D,
        roughness: 0.95,
        metalness: 0.1,
        transparent: true,
        opacity: 0.72
      });

      function createFigure(height, shoulderWidth, isFemale = false) {
        const fig = new THREE.Group();
        // Head
        const headGeo = new THREE.SphereGeometry(height * 0.08, 16, 16);
        const head = new THREE.Mesh(headGeo, silMat);
        head.position.y = height * 0.92;
        head.scale.set(0.85, 1.05, 0.85);
        fig.add(head);

        // Torso / Shoulders
        const torsoGeo = new THREE.CylinderGeometry(
          isFemale ? shoulderWidth * 0.35 : shoulderWidth * 0.48,
          isFemale ? shoulderWidth * 0.42 : shoulderWidth * 0.36,
          height * 0.36,
          16
        );
        const torso = new THREE.Mesh(torsoGeo, silMat);
        torso.position.y = height * 0.68;
        fig.add(torso);

        // Lower body / Coat
        const lowerGeo = new THREE.CylinderGeometry(
          isFemale ? shoulderWidth * 0.42 : shoulderWidth * 0.36,
          isFemale ? shoulderWidth * 0.46 : shoulderWidth * 0.38,
          height * 0.50,
          16
        );
        const lower = new THREE.Mesh(lowerGeo, silMat);
        lower.position.y = height * 0.25;
        fig.add(lower);

        return fig;
      }

      // Figure 1: Standing silhouette (male) in deep left background
      const fig1 = createFigure(2.1, 0.75, false);
      fig1.position.set(-4.2, 0.0, -4.5);
      fig1.rotation.y = 0.35;
      silhouetteGroup.add(fig1);

      // Figure 2: Standing silhouette (female) in deep right background
      const fig2 = createFigure(1.95, 0.62, true);
      fig2.position.set(4.4, 0.0, -5.2);
      fig2.rotation.y = -0.4;
      silhouetteGroup.add(fig2);

      // Figure 3: Subtle silhouette in far center-left
      const fig3 = createFigure(2.0, 0.70, false);
      fig3.position.set(-2.6, 0.0, -6.8);
      fig3.rotation.y = 0.15;
      silhouetteGroup.add(fig3);

      scene.add(silhouetteGroup);
    }

    window.addEventListener("load", () => {
      setTimeout(() => {
        // 1. Mute audio to avoid AudioContext warnings
        if (typeof sound !== "undefined" && sound) {
          sound.soundOn = false;
        }

        // 2. Set dark theme strictly
        if (typeof applyTheme === "function") {
          applyTheme("dark", false);
        }

        // 3. Ensure Caps-Lock green LED is completely off (per spec)
        if (keyMeshMap && keyMeshMap["caps"] && keyMeshMap["caps"].userData.ledLight) {
          keyMeshMap["caps"].userData.ledLight.intensity = 0;
        }

        // Re-orient keyboard to strictly face the user/camera (Spacebar in front, Esc top-left)
        if (typeof keyboardGroup !== "undefined" && keyboardGroup) {
          keyboardGroup.rotation.y = 0; // Strictly face the viewer
          keyboardGroup.rotation.x = 0.14; // Natural ~8 deg ergonomic tilt towards camera
          keyboardGroup.position.set(0, -0.05, 1.60);
        }

        // Place hamster paws resting cleanly behind the function row
        if (hamsterRoot && hamsterRoot.children.length >= 7) {
          hamsterRoot.children[5].position.set(-0.55, 0.42, 1.05);
          hamsterRoot.children[6].position.set(0.55, 0.42, 1.05);
        }

        // 4. Configure high-precision renderer with preserveDrawingBuffer
        const container = document.getElementById("canvas-container");
        if (renderer) {
          renderer.dispose();
          container.innerHTML = "";
        }

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(1600, 900);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        // 5. Add liminal human silhouettes in the background
        addLiminalSilhouettes();

        // 6. Camera framing for 16:9 widescreen showcase
        camera.fov = 37;
        camera.aspect = 1600 / 900;
        camera.updateProjectionMatrix();

        // Adjust portal window mesh position for optimal 16:9 composition
        if (typeof portalWindowMesh !== "undefined" && portalWindowMesh) {
          portalWindowMesh.position.set(-2.15, 0.95, 1.4);
          portalWindowMesh.rotation.y = 0.36;
        }

        window.renderReady = true;

        // Check if autostart requested via URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("autostart") === "true") {
          const totalFrames = parseInt(urlParams.get("total") || "240", 10);
          console.log("Auto-starting frame capture for " + totalFrames + " frames...");
          window.startCapture(totalFrames);
        }
      }, 500);
    });

    window.startCapture = async function(totalFrames = 240) {
      while (!window.renderReady) {
        await new Promise(r => setTimeout(r, 100));
      }
      for (let i = 0; i < totalFrames; i++) {
        window.renderLoopFrame(i, totalFrames);
        const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
        await fetch(`/save_frame?idx=${i}`, {
          method: 'POST',
          body: blob
        });
      }
      await fetch('/done', { method: 'POST' });
    };

    // Deterministic Frame-by-Frame Animator
    // Total frames: 240 (4.0s @ 60fps)
    window.renderLoopFrame = function(frameIndex, totalFrames = 240) {
      const t = (frameIndex / totalFrames) * 4.0; // 0.0 to 4.0 seconds
      const phase = (frameIndex / totalFrames) * 2.0 * Math.PI;

      // 1. Camera Subtle Orbit/Glide (Seamless Periodic Loop)
      const camX = 1.85 + Math.sin(phase) * 0.28;
      const camY = 1.82 + Math.cos(phase) * 0.06;
      const camZ = 6.65 + Math.sin(phase * 2.0) * 0.12;
      camera.position.set(camX, camY, camZ);
      controls.target.set(-0.28, 0.96, 0.22);
      controls.update();

      // 2. Giant Hamster Breathing (Periodic 1 Hz: 4 full cycles in 4s)
      const breath = Math.sin(t * 2.0 * Math.PI) * 0.022;
      if (hamsterRoot) {
        hamsterRoot.scale.set(1.4 + breath * 0.15, 1.4 - breath * 0.22, 1.4 + breath * 0.15);
      }

      // 3. Nose & Ear Micro-Twitches (Periodic)
      if (snoutGroup) {
        const twitch = Math.sin(t * 12.0 * Math.PI) * 0.008 * (Math.sin(phase) > 0.3 ? 1 : 0);
        snoutGroup.position.y = 0.96 + twitch;
        if (whiskersGroup) whiskersGroup.rotation.z = twitch * 1.5;
      }
      if (leftEarGroup && rightEarGroup) {
        const earTwitch = Math.sin(t * 8.0 * Math.PI) * 0.02 * (Math.cos(phase) > 0.4 ? 1 : 0);
        leftEarGroup.rotation.z = 0.25 + earTwitch;
        rightEarGroup.rotation.z = -0.25 - earTwitch;
      }

      // 4. Hamster Eyes Blinking & Gaze Tracking
      if (eyesGroup && eyeLeft && eyeRight) {
        // Gaze gently toward the floating HUD window on left
        eyesGroup.rotation.y = -0.12 + Math.sin(phase) * 0.05;
        eyesGroup.rotation.x = -0.04;

        // Blinks at t=0.5s and t=2.6s (each lasts ~8 frames)
        const isBlink1 = frameIndex >= 30 && frameIndex <= 38;
        const isBlink2 = frameIndex >= 155 && frameIndex <= 163;
        const blinkScale = (isBlink1 || isBlink2) ? 0.08 : 1.0;
        eyeLeft.scale.y = blinkScale;
        eyeRight.scale.y = blinkScale;
      }

      // 5. Scheduled Profile Switches & Tactile Keypresses
      // Switch 0 (Igor / linear / pink): starts frame 42 (t = 0.70s)
      // Switch 1 (Nastya / figma / green): starts frame 110 (t = 1.83s)
      // Switch 2 (Al11 / gcp / amber): starts frame 176 (t = 2.93s)
      let activeProfile = 0;
      let keyPressProgress = 0; // 0 to 1
      let pressedKeyId = "1";
      let keyColor = "#F43F5E";

      if (frameIndex >= 42 && frameIndex < 110) {
        activeProfile = 0;
        pressedKeyId = "1";
        keyColor = "#F43F5E";
        const offset = frameIndex - 42;
        if (offset < 20) {
          keyPressProgress = Math.sin((offset / 20) * Math.PI);
        }
      } else if (frameIndex >= 110 && frameIndex < 176) {
        activeProfile = 1;
        pressedKeyId = "2";
        keyColor = "#10B981";
        const offset = frameIndex - 110;
        if (offset < 20) {
          keyPressProgress = Math.sin((offset / 20) * Math.PI);
        }
      } else if (frameIndex >= 176 && frameIndex < 235) {
        activeProfile = 2;
        pressedKeyId = "3";
        keyColor = "#F59E0B";
        const offset = frameIndex - 176;
        if (offset < 20) {
          keyPressProgress = Math.sin((offset / 20) * Math.PI);
        }
      } else {
        // Frames 0..41 and 235..240: Rest state on Profile 0
        activeProfile = 0;
        keyPressProgress = 0;
      }

      // Update 3D Portal Window Texture on profile transitions
      if (window._currentActiveProfile !== activeProfile) {
        window._currentActiveProfile = activeProfile;
        createPortalCanvas("chrome", activeProfile);
        if (portalTexture) portalTexture.needsUpdate = true;
      }

      // 6. Portal Window Bounce Animation
      if (portalWindowMesh) {
        const bounceScale = 1.0 + keyPressProgress * 0.12;
        portalWindowMesh.scale.set(bounceScale, bounceScale, 1.0);
      }

      // 7. Cheeks Squish Spring Response
      if (cheeksGroup) {
        const squishFactor = keyPressProgress * 0.38;
        cheeksGroup.scale.set(1.0 + squishFactor, 1.0 - squishFactor * 0.6, 1.0 + squishFactor * 0.8);
      }

      // 8. Key Depression & Emissive Glow
      // Reset all interactive keys
      interactiveKeyMeshes.forEach(k => {
        k.position.y = k.userData.basePosY;
        if (k.material && k.material[2]) {
          k.material[2].emissiveIntensity = 0.35;
        }
      });

      // Depress Caps Lock & Target Key simultaneously
      if (keyPressProgress > 0) {
        const capsMesh = keyMeshMap["caps"];
        if (capsMesh) {
          capsMesh.position.y = capsMesh.userData.basePosY - 0.042 * keyPressProgress;
          if (capsMesh.material && capsMesh.material[2]) {
            capsMesh.material[2].emissiveIntensity = 0.35 + 2.4 * keyPressProgress;
          }
        }

        const targetMesh = keyMeshMap[pressedKeyId];
        if (targetMesh) {
          targetMesh.position.y = targetMesh.userData.basePosY - 0.045 * keyPressProgress;
          if (targetMesh.material && targetMesh.material[2]) {
            targetMesh.material[2].emissiveIntensity = 0.35 + 3.0 * keyPressProgress;
          }
        }
      }

      // 9. Render Scene
      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
