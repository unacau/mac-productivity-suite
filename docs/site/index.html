<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Khomyak — Instant Chrome Profile Switcher for macOS</title>
  <meta name="description" content="Switch Chrome profiles in 0ms across all macOS Spaces via Caps Lock + C.">

  <!-- OpenGraph -->
  <meta property="og:title" content="Khomyak — Instant Chrome Profile Switcher">
  <meta property="og:description" content="Switch Chrome profiles in 0ms across all macOS Spaces via Caps Lock + C.">
  <meta property="og:image" content="assets/images/khomyak_opengraph_banner.png">

  <link rel="icon" type="image/png" href="assets/images/AppIcon.png">
  <link rel="stylesheet" href="styles.css">

  <!-- Local Offline Three.js & Controls -->
  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/OrbitControls.js"></script>
</head>
<body class="liminal-body">

  <!-- Fullscreen 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Ultra-Clean, Zero-Noise UI Overlay -->
  <div class="ui-overlay">
    
    <!-- Top Bar: Minimalist Branding & Single Download Action -->
    <header class="top-nav">
      <div class="nav-brand">
        <img src="assets/images/AppIcon.png" alt="Khomyak Icon" class="brand-icon">
        <span class="brand-name">KHOMYAK</span>
      </div>

      <div class="nav-controls">
        <button id="sound-toggle" class="glass-btn sound-btn" title="Toggle tactile sound">
          <span id="sound-icon">🔊</span>
        </button>
        <a href="https://github.com/almosteleven/khomyak" target="_blank" rel="noopener" class="glass-link">
          GitHub ↗
        </a>
        <a href="assets/downloads/Khomyak.dmg" class="download-btn" download>
          <span>⬇️</span> Download DMG <span class="dmg-size">2.5 MB</span>
        </a>
      </div>
    </header>

    <!-- Bottom Center: Single Discrete Tactile Hint -->
    <footer class="bottom-hint">
      <span class="hint-text">
        Press <kbd class="glow-kbd">C</kbd> to Switch Chrome Profiles • Drag to Orbit • Click Hamster to Squeeze
      </span>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
