<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <style>
      .c-yellow { fill: #F6BC14; stroke: #161B26; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
      .c-ear-inner { fill: #FFFDF0; stroke: #161B26; stroke-width: 0.8; }
      .c-muzzle { fill: #FFFFFF; }
      .c-eye-outer { fill: #FFFFFF; stroke: #161B26; stroke-width: 1.3; }
      .c-eye-mid { fill: #FFFFFF; stroke: #161B26; stroke-width: 0.9; }
      .c-pupil { fill: #161B26; }
      .c-glare { fill: #FFFFFF; }
      .c-nose { fill: #E63946; stroke: #161B26; stroke-width: 0.6; stroke-linejoin: round; }
      .c-mouth { fill: none; stroke: #161B26; stroke-width: 1.0; stroke-linecap: round; }
      .c-paw { fill: #FFFFFF; stroke: #161B26; stroke-width: 1.1; stroke-linejoin: round; }
      .c-toe { fill: #E63946; }
    </style>
  </defs>
  <!-- Ears -->
  <circle cx="7.5" cy="7.5" r="4.2" class="c-yellow"/>
  <circle cx="7.5" cy="7.5" r="2.2" class="c-ear-inner"/>
  <circle cx="24.5" cy="7.5" r="4.2" class="c-yellow"/>
  <circle cx="24.5" cy="7.5" r="2.2" class="c-ear-inner"/>

  <!-- Cheeks -->
  <circle cx="9.0" cy="16.5" r="6.2" class="c-yellow"/>
  <circle cx="23.0" cy="16.5" r="6.2" class="c-yellow"/>

  <!-- Head Center Fill -->
  <path d="M 9 10 C 13 8.5, 19 8.5, 23 10 C 25.5 12, 26.5 15, 26.5 18 C 26.5 21, 21.5 22.5, 16 22.5 C 10.5 22.5, 5.5 21, 5.5 18 C 5.5 15, 6.5 12, 9 10 Z" fill="#F6BC14"/>

  <!-- White Muzzle -->
  <path d="M 12.5 9.5 C 12.5 9.5, 10.5 14, 10.5 18 C 10.5 21.5, 13 22.5, 16 22.5 C 19 22.5, 21.5 21.5, 21.5 18 C 21.5 14, 19.5 9.5, 19.5 9.5 Z" class="c-muzzle"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <circle cx="11.2" cy="13.8" r="4.2" class="c-eye-outer"/>
  <circle cx="11.2" cy="13.8" r="3.0" class="c-eye-mid"/>
  <circle cx="11.2" cy="13.8" r="1.9" class="c-pupil"/>
  <circle cx="12.0" cy="13.0" r="0.7" class="c-glare"/>

  <!-- Right Eye -->
  <circle cx="20.8" cy="13.8" r="4.2" class="c-eye-outer"/>
  <circle cx="20.8" cy="13.8" r="3.0" class="c-eye-mid"/>
  <circle cx="20.8" cy="13.8" r="1.9" class="c-pupil"/>
  <circle cx="21.6" cy="13.0" r="0.7" class="c-glare"/>

  <!-- Red Nose -->
  <polygon points="14.1,16.8 17.9,16.8 16.0,19.2" class="c-nose"/>

  <!-- Mouth -->
  <path d="M 13.8 20.0 C 14.6 20.8, 15.4 20.8, 16.0 20.0 C 16.6 20.8, 17.4 20.8, 18.2 20.0" class="c-mouth"/>

  <!-- Paws -->
  <circle cx="12.8" cy="22.8" r="2.5" class="c-paw"/>
  <circle cx="12.0" cy="21.8" r="0.35" class="c-toe"/>
  <circle cx="12.8" cy="21.5" r="0.35" class="c-toe"/>
  <circle cx="13.6" cy="21.8" r="0.35" class="c-toe"/>

  <circle cx="19.2" cy="22.8" r="2.5" class="c-paw"/>
  <circle cx="18.4" cy="21.8" r="0.35" class="c-toe"/>
  <circle cx="19.2" cy="21.5" r="0.35" class="c-toe"/>
  <circle cx="20.0" cy="21.8" r="0.35" class="c-toe"/>
</svg>