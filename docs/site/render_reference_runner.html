<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Khomyak Reference Sheet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 2048px;
      height: 2048px;
      overflow: hidden;
      background: transparent;
    }
    #canvas-container {
      width: 2048px;
      height: 2048px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .ui-overlay, .top-nav, .insight-card, .thought-bar-wrapper, .control-hint-pill {
      display: none !important;
    }
  </style>
  <script src="assets/js/three.min.js"></script>
  <script src="assets/js/OrbitControls.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    window.renderReady = false;
    window.addEventListener("load", () => {
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const theme = urlParams.get("theme") || "light";
        const fov = parseFloat(urlParams.get("fov") || "40");
        const camX = parseFloat(urlParams.get("camX") || "0");
        const camY = parseFloat(urlParams.get("camY") || "1.60");
        const camZ = parseFloat(urlParams.get("camZ") || "5.80");
        const targetX = parseFloat(urlParams.get("targetX") || "0");
        const targetY = parseFloat(urlParams.get("targetY") || "1.12");
        const targetZ = parseFloat(urlParams.get("targetZ") || "0");
        const noKeyboard = urlParams.get("noKeyboard") === "true";
        const transparent = urlParams.get("transparent") === "true";
        const res = parseInt(urlParams.get("res") || "2048");

        // 1. Remove UI-only objects
        if (typeof portalWindowMesh !== "undefined" && portalWindowMesh) {
          scene.remove(portalWindowMesh);
        }

        // 2. Remove keyboard if requested
        if (noKeyboard && typeof keyboardGroup !== "undefined" && keyboardGroup) {
          scene.remove(keyboardGroup);
          
          const pawSpacing = parseFloat(urlParams.get("pawSpacing") || "0.24");
          const pawY = parseFloat(urlParams.get("pawY") || "0.45");
          const pawZ = parseFloat(urlParams.get("pawZ") || "1.05");
          if (hamsterRoot && hamsterRoot.children.length >= 7) {
            hamsterRoot.children[5].position.set(-pawSpacing, pawY, pawZ);
            hamsterRoot.children[6].position.set(pawSpacing, pawY, pawZ);
            hamsterRoot.children[5].rotation.x = 0.15;
            hamsterRoot.children[6].rotation.x = 0.15;
          }
        }

        // 3. Apply theme
        if (typeof applyTheme === "function") {
          applyTheme(theme, false);
        }

        // 4. Center Key light for balanced portrait
        if (typeof keyLight !== "undefined" && keyLight) {
          keyLight.position.set(0.5, 8.5, 5.5);
        }

        // 5. Transparent alpha cutout mode
        // Always hide background architectural pillars and overhead panel in reference runner
    if (typeof panelMesh !== "undefined" && panelMesh) panelMesh.visible = false;
    if (typeof pillarMeshes !== "undefined") pillarMeshes.forEach(p => p.visible = false);

    if (transparent) {
          const container = document.getElementById("canvas-container");
          if (renderer) {
            renderer.dispose();
            container.innerHTML = "";
          }
          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
          renderer.setSize(res, res);
          renderer.setPixelRatio(1);
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.08;
          renderer.setClearColor(0x000000, 0);
          container.appendChild(renderer.domElement);

          scene.background = null;
          if (typeof floorMesh !== "undefined" && floorMesh) floorMesh.visible = false;
          if (typeof panelMesh !== "undefined" && panelMesh) panelMesh.visible = false;
          if (typeof pillarMeshes !== "undefined") pillarMeshes.forEach(p => p.visible = false);
        } else {
          renderer.setSize(res, res);
        }

        // 6. Camera & Controls
        camera.fov = fov;
        camera.position.set(camX, camY, camZ);
        controls.target.set(targetX, targetY, targetZ);
        controls.update();
        camera.updateProjectionMatrix();

        // 7. Render
        renderer.render(scene, camera);
        window.renderReady = true;
      }, 500);
    });
  </script>
</body>
</html>
