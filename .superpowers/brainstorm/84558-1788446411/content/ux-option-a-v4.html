<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  body { font-family: 'Inter', sans-serif; color: #FFFFFF; }
  
  .macos-window {
    background: #0F172A;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.08);
    width: 800px;
    margin: 0 auto;
    overflow: hidden;
    position: relative;
  }
  
  .macos-header {
    height: 52px;
    background: rgba(30,41,59,0.5);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: center;
    position: relative;
  }
  
  .traffic-lights {
    position: absolute;
    left: 20px;
    display: flex;
    gap: 8px;
  }
  .traffic-lights div { width: 12px; height: 12px; border-radius: 50%; }
  .tl-red { background: #FF5F56; }
  .tl-yellow { background: #FFBD2E; }
  .tl-green { background: #27C93F; }
  
  .tab-bar {
    display: flex;
    gap: 4px;
    background: #192134;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .tab {
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #94A3B8;
    border-radius: 6px;
    cursor: pointer;
  }
  .tab.active {
    background: rgba(255,255,255,0.1);
    color: #FFFFFF;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  .content-area {
    padding: 32px 40px;
    background: #0F172A;
    min-height: 400px;
    position: relative;
  }

  /* Global Instructions replacing repeated elements */
  .global-instructions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .global-instructions h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 500;
    color: #E2E8F0;
  }
  .global-instructions p {
    margin: 4px 0 0 0;
    font-size: 13px;
    color: #94A3B8;
  }
  .global-prefix-badge {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: #94A3B8;
  }
  .global-prefix-badge span {
    color: #E2E8F0;
    font-weight: 600;
  }

  .profile-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 40px;
  }

  .profile-card {
    background: #192134;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s;
    cursor: pointer;
    position: relative;
  }
  .profile-card:hover {
    background: #1E293B;
    border-color: rgba(255,255,255,0.15);
  }
  .profile-card.swapped {
    animation: popSwap 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-color: rgba(16, 185, 129, 0.5);
    background: rgba(16, 185, 129, 0.05);
  }
  @keyframes popSwap {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: white;
    border: 2px solid rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .avatar.default { background: linear-gradient(135deg, #059669, #3B82F6); }
  .avatar.al11 { background: linear-gradient(135deg, #EA580C, #EAB308); }
  .avatar.gcp { background: linear-gradient(135deg, #2563EB, #06B6D4); }
  .avatar.nastya { background: linear-gradient(135deg, #9333EA, #DB2777); }

  /* Play icon overlay on hover for Test Focus */
  .avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .avatar svg {
    position: absolute;
    z-index: 1;
    width: 20px;
    height: 20px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    transform: scale(0.8);
  }
  .profile-card:hover .avatar::after,
  .profile-card:hover .avatar svg {
    opacity: 1;
    transform: scale(1);
  }

  .identity { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 15px; font-weight: 600; color: #F8FAFC; }
  .email { font-size: 13px; color: #94A3B8; }

  /* Number Picker Area */
  .activation-number {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, monospace;
    font-size: 16px;
    color: #E2E8F0;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .activation-number:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
  }

  /* Popover for Number Selection */
  .number-popover {
    position: absolute;
    top: 50%;
    right: 56px;
    transform: translateY(-50%) translateX(10px) scale(0.95);
    background: rgba(30,41,59,0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.5);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .number-popover.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(-50%) translateX(0) scale(1);
  }
  
  .num-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.05);
    background: rgba(255,255,255,0.03);
    color: #FFF;
    font-size: 14px;
    font-family: ui-monospace, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }
  .num-btn:hover {
    background: #059669;
    border-color: #10B981;
    transform: scale(1.1);
    z-index: 2;
  }
  .num-btn.in-use::after {
    content: '';
    position: absolute;
    bottom: 4px;
    width: 4px;
    height: 4px;
    background: #94A3B8;
    border-radius: 50%;
  }
  .num-btn.in-use:hover::after {
    background: #FFF;
  }
  .num-btn.in-use:hover::before {
    content: '⇄';
    position: absolute;
    top: -24px;
    background: #192134;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
    color: #94A3B8;
    pointer-events: none;
    white-space: nowrap;
  }

  /* Micro status footer */
  .micro-footer {
    position: absolute;
    bottom: 20px;
    left: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .micro-dot {
    width: 6px;
    height: 6px;
    background: #10B981;
    border-radius: 50%;
    animation: pulse 3s infinite;
  }
  .micro-text {
    font-size: 12px;
    color: #64748B;
    font-weight: 500;
  }
</style>

<div style="padding-bottom: 24px;">
  <h2>Chrome Profiles UX (v4)</h2>
  <p class="subtitle">Minimalist layout, extracted repeated elements, hover-to-test.</p>
</div>

<div class="macos-window">
  <div class="macos-header">
    <div class="traffic-lights">
      <div class="tl-red"></div><div class="tl-yellow"></div><div class="tl-green"></div>
    </div>
    <div class="tab-bar">
      <div class="tab">General</div>
      <div class="tab">Shortcuts</div>
      <div class="tab active">Chrome Profiles</div>
      <div class="tab">Advanced</div>
    </div>
  </div>

  <div class="content-area" id="app-state">
    
    <div class="global-instructions">
      <div>
        <h3>Profile Shortcuts</h3>
        <p>Assign a number to quickly focus a specific profile.</p>
      </div>
      <div class="global-prefix-badge">
        Prefix key: <span>Hyper + C + </span>[Num]
      </div>
    </div>

    <div class="profile-grid">
      <!-- Cards will be rendered via JS for dynamic swapping -->
    </div>

    <!-- Micro safety feeling -->
    <div class="micro-footer">
      <div class="micro-dot"></div>
      <span class="micro-text">Profiles mapping is actively synchronized</span>
    </div>
  </div>
</div>

<script>
  // State
  const profiles = [
    { id: 'p1', name: 'Igor', email: 'igorekishev92@gmail.com', avatarClass: 'default', initial: 'I', num: 1 },
    { id: 'p2', name: 'Igor (Al11)', email: 'igor@almosteleven.com', avatarClass: 'al11', initial: 'A', num: 2 },
    { id: 'p3', name: 'Igor (GCP Free Trial)', email: 'igorekishev729@gmail.com', avatarClass: 'gcp', initial: 'G', num: 3 },
    { id: 'p4', name: 'Nastya', email: 'betapoozytron@gmail.com', avatarClass: 'nastya', initial: 'N', num: 4 }
  ];

  let activePopoverId = null;

  function render() {
    const grid = document.querySelector('.profile-grid');
    grid.innerHTML = '';

    profiles.forEach(p => {
      const card = document.createElement('div');
      card.className = 'profile-card';
      card.id = `card-${p.id}`;
      card.onclick = (e) => {
        // Test focus interaction if clicked anywhere but the number box
        if (!e.target.closest('.activation-number')) {
          const av = card.querySelector('.avatar');
          av.style.transform = 'scale(0.9)';
          setTimeout(() => av.style.transform = '', 150);
        }
      };
      
      card.innerHTML = `
        <div class="avatar ${p.avatarClass}">
          ${p.initial}
          <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="identity">
          <span class="name">${p.name}</span>
          <span class="email">${p.email}</span>
        </div>
        <div class="activation-number" id="num-${p.id}" onclick="togglePopover('${p.id}', event)">
          ${p.num}
          <div class="number-popover" id="popover-${p.id}">
            ${[1,2,3,4,5,6,7,8,9].map(n => {
              const inUse = profiles.find(x => x.num === n && x.id !== p.id);
              return `<div class="num-btn ${inUse ? 'in-use' : ''}" onclick="selectNumber('${p.id}', ${n}, event)">${n}</div>`;
            }).join('')}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function togglePopover(pid, e) {
    e.stopPropagation();
    document.querySelectorAll('.number-popover').forEach(p => p.classList.remove('active'));
    
    if (activePopoverId !== pid) {
      document.getElementById(`popover-${pid}`).classList.add('active');
      activePopoverId = pid;
    } else {
      activePopoverId = null;
    }
  }

  function selectNumber(sourcePid, newNum, e) {
    e.stopPropagation();
    
    const sourceProfile = profiles.find(p => p.id === sourcePid);
    const targetProfile = profiles.find(p => p.num === newNum);

    if (targetProfile && targetProfile.id !== sourcePid) {
      // Swap!
      const oldNum = sourceProfile.num;
      sourceProfile.num = newNum;
      targetProfile.num = oldNum;
      
      render();
      document.getElementById(`card-${sourceProfile.id}`).classList.add('swapped');
      document.getElementById(`card-${targetProfile.id}`).classList.add('swapped');
      
      setTimeout(() => {
        document.getElementById(`card-${sourceProfile.id}`)?.classList.remove('swapped');
        document.getElementById(`card-${targetProfile.id}`)?.classList.remove('swapped');
      }, 500);
    } else {
      sourceProfile.num = newNum;
      render();
    }
    
    activePopoverId = null;
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.number-popover').forEach(p => p.classList.remove('active'));
    activePopoverId = null;
  });

  render();
</script>
